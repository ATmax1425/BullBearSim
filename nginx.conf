user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # ---------------------------------------------------------
    # Gzip (Frontend assets)
    # ---------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain application/json application/javascript text/css
               image/svg+xml application/manifest+json;

    # ---------------------------------------------------------
    # Docker DNS — re-resolve upstreams so a recreated container
    # (new IP) doesn't leave nginx returning 502s.
    # ---------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Max concurrent WebSocket connections per client IP.
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # ---------------------------------------------------------
    # Cloudflare real IPs (for logs and per-IP limits)
    # Source: https://www.cloudflare.com/ips/ — re-check occasionally.
    # ---------------------------------------------------------
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header CF-Connecting-IP;

    # ---------------------------------------------------------
    # HTTP (port 80) — DROP ALL
    # ---------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 444;
    }

    # ---------------------------------------------------------
    # HTTPS — Frontend + API
    # ---------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # Cloudflare Origin Certificate paths
        ssl_certificate     /etc/letsencrypt/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/privkey.pem;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Variables make nginx resolve the names per request (see resolver).
        set $frontend_upstream frontend;
        set $ws_upstream ws_api;

        # -----------------------------------------------------
        # FRONTEND
        # -----------------------------------------------------
        location / {
            proxy_pass http://$frontend_upstream:80;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # -----------------------------------------------------
        # FastAPI WebSocket (/ws) and health check (/ws/health)
        # -----------------------------------------------------
        location /ws {
            # No URI part: the request path (/ws, /ws/health) is passed through as-is.
            proxy_pass http://$ws_upstream:8000;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keep idle WebSockets open (default is 60s).
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;

            limit_conn ws_conn 20;
        }
    }
}
