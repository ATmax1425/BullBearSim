user  nginx;
worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain application/json application/javascript text/css
               image/svg+xml application/manifest+json;

    # Docker DNS — re-resolve upstreams when containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------------------------------------------------------
    # LOCAL HTTP SERVER — NO HTTPS, NO CERTS
    # ---------------------------------------------------------
    server {
        listen 80;
        server_name _;

        set $frontend_upstream frontend;
        set $ws_upstream ws_api;

        # -----------------------------------------------------
        # FRONTEND
        # -----------------------------------------------------
        location / {
            proxy_pass http://$frontend_upstream:80;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------------------------------------
        # FastAPI WebSocket (/ws) and health check (/ws/health)
        # -----------------------------------------------------
        location /ws {
            proxy_pass http://$ws_upstream:8000;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
